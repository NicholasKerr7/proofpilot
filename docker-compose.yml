services:
  postgres:
    image: postgres:16-alpine
    container_name: proofpilot-postgres
    environment:
      POSTGRES_USER: proofpilot
      POSTGRES_PASSWORD: proofpilot
      POSTGRES_DB: proofpilot
    ports:
      - "5432:5432"
    volumes:
      - proofpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpilot -d proofpilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: proofpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: proofpilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proofpilot
      MINIO_ROOT_PASSWORD: proofpilot-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - proofpilot-minio:/data

volumes:
  proofpilot-postgres:
  proofpilot-minio:

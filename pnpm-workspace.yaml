packages:
  - "apps/*"
  - "packages/*"

overrides:
  js-yaml@4.3.0: 4.3.1
  js-yaml@5.2.1: 5.2.3
  postcss: 8.5.26
  sharp: 0.35.3

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  tesseract.js: false
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
